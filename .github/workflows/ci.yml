name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Run health checks (demo exits 1 on its built-in failure scenarios)
        run: |
          set +e
          python health_check.py
          code=$?
          set -e
          test "$code" -eq 1
          test -f report.json
          echo "Demo behaved as documented: exit $code with report.json written."
